name: Public Website — Live Dashboard Smoke
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  schedule:
    - cron: "19 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-dashboard-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify live dashboard values and browser errors
        run: python tests/live_smoke.py
      - name: Save production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-dashboard-screenshots
          path: screenshots_live/
          if-no-files-found: ignore
          retention-days: 14
