name: Public Website — Live Dashboard Smoke
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  schedule:
    - cron: "19 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-dashboard-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Wait until public Pages serves the updated dashboard script
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              request = urllib.request.Request(
                  'https://dicureck.github.io/?smoke=' + str(attempt),
                  headers={'Cache-Control': 'no-cache', 'User-Agent': 'portfolio-smoke/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      html = response.read().decode('utf-8')
                  if 'app.20261015-stable.js' in html:
                      print('Production index references the corrected immutable JavaScript')
                      break
              except Exception as err:
                  print('Waiting for production Pages:', type(err).__name__)
              time.sleep(7)
          else:
              raise RuntimeError('Production did not publish versioned JavaScript in time')
          PY
      - name: Verify live dashboard values and browser errors
        run: python tests/live_smoke.py
      - name: Save production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-dashboard-screenshots
          path: screenshots_live/
          if-no-files-found: ignore
          retention-days: 14
